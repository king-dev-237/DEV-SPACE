<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UBC | USSD Engine - Admin Login</title>
  <link rel="icon" href="/web/images/ussd-ubc-logo.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #0052CC 0%, #003D99 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      top: -250px;
      left: -250px;
      animation: float 20s infinite ease-in-out;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      bottom: -200px;
      right: -200px;
      animation: float 25s infinite ease-in-out reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(20px); }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      background: #ffffff;
      padding: 0;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 82, 204, 0.25), 0 0 1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      animation: slideUp 0.6s ease-out;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
    }

    .banner-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .container:hover .banner-image {
      transform: scale(1.02);
    }

    .form-container {
      padding: 2.5rem 2rem;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      color: #0052CC;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .message {
      text-align: center;
      color: red;
      font-size: 0.80rem;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 0.75rem;
      font-weight: 600;
      color: #1f2937;
      font-size: 0.95rem;
      text-transform: capitalize;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 0.95rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      background: #f9fafb;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:hover {
      border-color: #d1d5db;
      background: #ffffff;
    }

    input:focus {
      border-color: #0052CC;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.1), inset 0 0 0 1px rgba(0, 82, 204, 0.05);
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #0052CC, #003D99);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 82, 204, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .links {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1.75rem;
      border-top: 1px solid #e5e7eb;
    }

    .links-text {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .links a {
      color: #0052CC;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      display: inline-block;
      margin: 0 0.25rem;
    }

    .links a:hover {
      color: #003D99;
      text-decoration: underline;
      transform: translateY(-1px);
    }

    .links-separator {
      color: #d1d5db;
      margin: 0 0.5rem;
    }

    @media (max-width: 480px) {
      .container {
        max-width: 100%;
        border-radius: 16px;
      }

      .form-container {
        padding: 2rem 1.5rem;
      }

      h2 {
        font-size: 1.5rem;
      }

      .btn {
        padding: 0.9rem;
        font-size: 0.95rem;
      }
    }

    .auth-method-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 12px;
    }

    .toggle-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #9ca3af;
      transition: color 0.3s ease;
    }

    .toggle-label.active {
      color: #0052CC;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #0052CC;
      transition: 0.4s;
      border-radius: 28px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    .switch input:checked + .slider {
      background-color: #10b981;
    }

    .switch input:checked + .slider:before {
      transform: translateX(28px);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/web/images/ubc-plc-logo.png" alt="UBC PLC Banner" class="banner-image">
    <div class="form-container">
      <h2>USSD Engine | Dashboard</h2>
      <p class="subtitle">Admin Login to your account</p>
      <p class="message">{{ prev_session_message }}</p>
      <form method="POST" action="/admin/auth">
        <div class="form-group">
          <label for="email">Username or Email Address</label>
          <input type="email" id="email" name="username" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="auth-method-toggle">
          <span class="toggle-label" id="local-label">Local</span>
          <label class="switch">
            <input type="checkbox" id="auth-toggle">
            <span class="slider"></span>
          </label>
          <span class="toggle-label active" id="ldap-label">LDAP</span>
        </div>
        <label for="tenant"></label><input type="text" hidden="hidden" id="tenant" name="tenant">
        <button onclick="submitLoginRequest()" type="submit" class="btn">Sign In</button>
      </form>
      <div class="links">
        <p class="links-text">Don't have an account?</p>
        <a href="#">Create Account</a>
        <span class="links-separator">•</span>
        <a href="#">Forgot Password?</a>
      </div>
    </div>
  </div>
<script>
  const authToggle = document.getElementById('auth-toggle');
  const localLabel = document.getElementById('local-label');
  const ldapLabel = document.getElementById('ldap-label');
  const tenant = document.getElementById('tenant');
  // Set initial state (LDAP by default)
  authToggle.checked = false;
  ldapLabel.classList.add('active');
  localLabel.classList.remove('active');

  authToggle.addEventListener('change', function () {
    if (this.checked) {
      localLabel.classList.add('active');
      ldapLabel.classList.remove('active');
      tenant.value = "local";
    } else {
      ldapLabel.classList.add('active');
      localLabel.classList.remove('active');
      tenant.value = "ldap";
    }
  });

  async function submitLoginRequest() {
    document.getElementById('tenant').value = authToggle.checked ? 'local' : 'ldap';
  }
</script>
</body>
</html>
