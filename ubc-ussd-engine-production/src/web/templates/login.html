<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UBC | USSD Engine - Sign In</title>
  <link rel="icon" href="/web/images/ussd-ubc-logo.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #0052CC 0%, #003D99 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      top: -250px;
      left: -250px;
      animation: float 20s infinite ease-in-out;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      bottom: -200px;
      right: -200px;
      animation: float 25s infinite ease-in-out reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(20px); }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      background: #ffffff;
      padding: 0;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 82, 204, 0.25), 0 0 1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      animation: slideUp 0.6s ease-out;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
    }

    .banner-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .container:hover .banner-image {
      transform: scale(1.02);
    }

    .form-container {
      padding: 2.5rem 2rem;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      color: #0052CC;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 0.75rem;
      font-weight: 600;
      color: #1f2937;
      font-size: 0.95rem;
      text-transform: capitalize;
      letter-spacing: 0.3px;
    }

    input {
      width: 100%;
      padding: 0.95rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      background: #f9fafb;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:hover {
      border-color: #d1d5db;
      background: #ffffff;
    }

    input:focus {
      border-color: #0052CC;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.1), inset 0 0 0 1px rgba(0, 82, 204, 0.05);
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #0052CC, #003D99);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 82, 204, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .links {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1.75rem;
      border-top: 1px solid #e5e7eb;
    }

    .links-text {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .links a {
      color: #0052CC;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      display: inline-block;
      margin: 0 0.25rem;
    }

    .links a:hover {
      color: #003D99;
      text-decoration: underline;
      transform: translateY(-1px);
    }

    .links-separator {
      color: #d1d5db;
      margin: 0 0.5rem;
    }

    @media (max-width: 480px) {
      .container {
        max-width: 100%;
        border-radius: 16px;
      }

      .form-container {
        padding: 2rem 1.5rem;
      }

      h2 {
        font-size: 1.5rem;
      }

      .btn {
        padding: 0.9rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/web/images/ubc-plc-logo.png" alt="UBC PLC Banner" class="banner-image">
    <div class="form-container">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your account</p>
      <form>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
      <div class="links">
        <p class="links-text">Don't have an account?</p>
        <a href="#">Create Account</a>
        <span class="links-separator">•</span>
        <a href="#">Forgot Password?</a>
      </div>
    </div>
  </div>
</body>
</html>
